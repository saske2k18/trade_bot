trading:
  # Exchange configuration
  exchange: "binance"
  api_key: "${BINANCE_API_KEY}"
  api_secret: "${BINANCE_API_SECRET}"
  
  # Trading pairs
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
  
  # Timeframe for analysis
  timeframe: "1h"
  
  # Order settings
  order_type: "market"
  dry_run: true  # Set to false for real trading

risk_management:
  # Position sizing (percentage of portfolio)
  max_position_size: 0.1
  
  # Stop loss and take profit (percentage)
  stop_loss: 0.02
  take_profit: 0.05
  
  # Maximum number of open positions
  max_open_positions: 3
  
  # Daily loss limit (percentage)
  daily_loss_limit: 0.05

model:
  # Model type: lstm, gru, transformer, xgboost
  type: "lstm"
  
  # Lookback period for predictions
  lookback: 100
  
  # Prediction horizon
  horizon: 10
  
  # Training parameters
  train_split: 0.8
  validation_split: 0.1
  
  # Hyperparameters
  hidden_units: 128
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 32
  epochs: 50

data:
  # Data source
  source: "ccxt"
  
  # Cache directory
  cache_dir: "data/raw"
  
  # Features to calculate
  features:
    - "sma_20"
    - "sma_50"
    - "rsi_14"
    - "macd"
    - "bollinger_bands"
    - "volume_sma_20"

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # Log file
  file: "logs/trade_bot.log"
  
  # Console output
  console: true
  
  # Rotation settings
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5

database:
  # Database type: sqlite, postgresql
  type: "sqlite"
  
  # Database path (for sqlite)
  path: "data/trades.db"
  
  # Connection string (for postgresql)
  # connection_string: "postgresql://user:password@localhost:5432/trade_bot"

trading:
  exchange: "binance"
  api_key: "${BINANCE_API_KEY}"
  api_secret: "${BINANCE_API_SECRET}"

  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
    - "SOL/USDT"
    - "XRP/USDT"

  timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "12h"
    - "1d"
    - "1w"

  order_type: "market"
  dry_run: true

risk_management:
  max_position_size: 0.1

  stop_loss: 0.02
  take_profit: 0.05

  max_open_positions: 3

  daily_loss_limit: 0.05

model:
  type: "multi_timeframe_lstm"

  lookback:
    "5m": 60
    "15m": 48
    "1h": 48
    "4h": 48
    "12h": 20
    "1d": 30
    "1w": 12

  horizon: 10

  train_split: 0.8
  validation_split: 0.1

  hidden_units: 128
  num_layers: 2
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 32
  epochs: 50

  fusion_method: "attention"

data:
  source: "ccxt"
  cache_dir: "data/raw"

  history:
    start_date: "2010-01-01"
    max_batches_per_request: 3000

  features:
    - "sma_20"
    - "sma_50"
    - "rsi_14"
    - "macd"
    - "bollinger_bands"
    - "volume_sma_20"

logging:
  level: "INFO"

  file: "logs/trade_bot.log"

  console: true

  rotation:
    max_bytes: 10485760
    backup_count: 5

database:
  type: "sqlite"

  path: "data/trades.db"
